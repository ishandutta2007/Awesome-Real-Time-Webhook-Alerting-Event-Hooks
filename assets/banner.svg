<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }

    /* Ambient pulse animations behind text */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-1 {
      animation: pulseOrb 6s ease-in-out infinite;
      transform-origin: 150px 100px;
    }
    .orb-2 {
      animation: pulseOrb 8s ease-in-out infinite 1s;
      transform-origin: 1050px 240px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }

    .pulse-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 15s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Animated Ambient Light Orbs (Deep Background) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="160" cy="90" r="110" fill="#38bdf8" opacity="0.25" />
    <circle class="orb-2" cx="1040" cy="240" r="120" fill="#c084fc" opacity="0.2" />
    <circle cx="600" cy="320" r="140" fill="#6366f1" opacity="0.15" />
  </g>

  <!-- Flowing Network Webhook Grid lines (Background) -->
  <g opacity="0.25">
    <path class="pulse-path" d="M -50 260 C 200 200, 400 300, 650 240 C 900 180, 1050 280, 1250 220" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="pulse-path" d="M -50 80 C 250 140, 500 40, 750 110 C 1000 180, 1150 70, 1250 120" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="220" cy="60" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="980" cy="80" r="3.5" fill="#c084fc" />
  <circle class="particle-3" cx="150" cy="270" r="2.5" fill="#818cf8" />
  <circle class="particle-1" cx="1080" cy="280" r="4" fill="#34d399" />
  <circle class="particle-2" cx="540" cy="50" r="2.5" fill="#f472b6" />

  <!-- Center Content Badge -->
  <g transform="translate(600, 55)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.8" />
    <!-- Small pulsating live status dot -->
    <circle cx="-115" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="tag-text" x="-100" y="4.5" text-anchor="start">REAL-TIME EVENT HOOKS</text>
  </g>

  <!-- Main Title with Gradient Accent -->
  <text class="title" x="600" y="135" text-anchor="middle">
    Awesome Real-Time Webhook Alerting
  </text>
  <text class="title" x="600" y="180" text-anchor="middle" fill="url(#primaryGrad)">
    &amp; Event Hooks Infrastructure
  </text>

  <!-- Subtitle -->
  <text class="subtitle" x="600" y="222" text-anchor="middle">
    Curated SaaS Gateways, Open-Source Brokers, Ingestion Pipelines &amp; Retries
  </text>

  <!-- Footer Pills / Highlights -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Webhook-as-a-Service -->
    <g transform="translate(-320, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" x="0" y="4.5" text-anchor="middle">⚡ Webhooks-as-a-Service</text>
    </g>

    <!-- Pill 2: Event Queues & DLQ -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" x="0" y="4.5" text-anchor="middle">🛡️ Backoff Retries &amp; DLQ</text>
    </g>

    <!-- Pill 3: HMAC Signatures -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" x="0" y="4.5" text-anchor="middle">🔐 HMAC Verification</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(320, 0)">
      <rect x="-90" y="-15" width="180" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" x="0" y="4.5" text-anchor="middle">🚀 Open-Source &amp; Cloud</text>
    </g>
  </g>
</svg>
